plugins { id 'net.fabricmc.fabric-loom' version '1.19.3' }
base { archivesName = 'graalweave' }
dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    implementation 'net.fabricmc:fabric-loader:0.20.1'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.165.0+26.3'
    implementation(project(':core')) { transitive = false }
    include project(':core')
    implementation(project(':cli')) { transitive = false }
    include project(':cli')
}
// Loom include is non-transitive: include each resolved runtime JAR separately.
configurations { embeddedRuntime }
dependencies {
    embeddedRuntime "org.graalvm.polyglot:python:${graalpyVersion}"
    embeddedRuntime "org.graalvm.python:python-embedding:${graalpyVersion}"
    embeddedRuntime "org.graalvm.python:python-launcher:${graalpyVersion}"
    embeddedRuntime 'com.google.code.gson:gson:2.13.2'
    embeddedRuntime 'org.jline:jline:3.30.6'
}
configurations.embeddedRuntime.resolvedConfiguration.resolvedArtifacts.findAll { it.file.name.endsWith('.jar') }.each { artifact ->
    dependencies.add('implementation', artifact.moduleVersion.id.toString()) { transitive = false }
    dependencies.add('include', artifact.moduleVersion.id.toString())
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
