plugins { id 'java' }
dependencies {
    implementation project(':core')
    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'org.jline:jline:3.30.6'
}
tasks.register('integration', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.graalweave.cli.StdinCheck'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

if (!providers.gradleProperty('coreOnly').isPresent()) {
    tasks.register('installationIntegration', JavaExec) {
        dependsOn testClasses, ':mod:jar'
        classpath = sourceSets.test.runtimeClasspath
        mainClass = 'dev.graalweave.cli.StdinCheck'
        jvmArgs '--enable-native-access=ALL-UNNAMED'
        doFirst { args project(':mod').tasks.named('jar').get().archiveFile.get().asFile.absolutePath }
    }
}
